# DAG / polynomial equation config for trl 1.2 / transformers 5.5
# vLLM mode: COLOCATE  (vLLM runs inside every training rank, all 8 GPUs train)
#
# Experiment: Qwen2.5-3B on 10-Uniform (ancestor depth sampled uniformly in 1..10)
#
# Usage:
#   ./scripts/train.sh configs/qwen-10-uniform.yaml
#
# No separate vLLM server needed. Each rank spawns its own vLLM worker on
# its GPU and shares the KV cache budget with the training model.

# Model arguments
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
bf16: true
tf32: true
output_dir: runs/qwen-10-uniform

# Dataset arguments
dataset_samples: 80000
graph_type: dag            # chain | tree | reverse_tree | dag
write_samples_probability: 1
min_nodes: 10
max_nodes: 10
sampling_strategy: uniform_size
max_label_value: 10
fixed_label_set: false
min_start_value: 0
max_start_value: 1

# DAG graph params
max_in_degree: 2
edge_probability: 0.2
#force_unique_topo_order: true

# Polynomial equation params (keep small to avoid value blow-up)
max_degree: 1              # max exponent per variable in a monomial
max_coefficient: 1         # max absolute coefficient
max_terms: 2            # ignored when terms_equal_in_degree or probabilistic_pairwise_terms
terms_equal_in_degree: false  # ignored when probabilistic_pairwise_terms is true
probabilistic_pairwise_terms: true  # if true, independently sample x_i, x_i*x_j, and const terms
single_variable_term_probability: 1
pairwise_product_term_probability: 0
constant_term_probability: 0.6666
min_constant: 0
max_constant: 1

# Target selection
target_sink_only: true
max_value: 5000
modulus: 2

# Bucketed ancestor-graph depth control (dag only).
# Splits ALL nodes into `ancestor_depth` buckets, each with >=1 node, wires
# a spine through every bucket, and only allows edges that strictly descend
# bucket levels. The target ends up with ancestor-graph depth exactly
# `ancestor_depth - 1` (longest root->target path = ancestor_depth nodes).
# Use ancestor_depths for a sparse list, or min/max_ancestor_depth for a
# contiguous range. Mutually exclusive with each other and with
# `force_unique_topo_order`; takes precedence over min/max_ancestor_nodes.
min_ancestor_depth: 1
max_ancestor_depth: 10

# Prompt length cap (filters the dataset; replaces the removed
# GRPOConfig.max_prompt_length truncation)
max_prompt_length: 512

# Training arguments
num_train_epochs: 1
max_steps: 800
# NOTE on per_device_train_batch_size:
# trl v0.15 (PR #2776) redefined per_device_train_batch_size from "prompts per
# device" to "generations per device". To match the old trl 0.14 behavior
# (per_device=1 meaning 1 prompt/device, then expanded by num_generations),
# set per_device = num_generations * num_prompts_per_device. With
# num_generations=8 and 1 prompt/device, that's 8.
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.03

# GRPO specific parameters
# Divisibility constraint: num_processes * per_device_train_batch_size *
#   gradient_accumulation_steps must be divisible by num_generations.
#   Here: 8 * 8 * 8 = 512, and 512 / 8 = 64 (unique prompt groups/opt step).
beta: 0.0001
max_completion_length: 1024
num_generations: 8
use_vllm: true

# vLLM: colocated on every training GPU
# - vllm_gpu_memory_utilization is the FRACTION of each GPU's memory reserved
#   for vLLM KV cache. Must be low because DeepSpeed ZeRO-3 + activations also
#   live on the same GPU. ~0.25 gives ~12GB of KV on a 48GB card, plenty for
#   8 concurrent 1024-token generations on a 3B model.
# - If you still OOM, drop to 0.2; if generation is slow / KV-cache-bound,
#   bump to 0.3.
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.25
vllm_max_model_length: 2048

# Logging arguments
logging_strategy: steps
logging_steps: 2000
report_to:
- tensorboard
save_strategy: steps
save_steps: 2000
seed: 42

# Hugging Face Hub
push_to_hub: false
hub_strategy: every_save
