# Configuration for 15-Uniform experiment
# Training distribution: reasoning steps sampled uniformly from 1 to 14
#
# Model arguments
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
bf16: true
tf32: true
output_dir: runs/qwen-2.5-3b-15-uniform_seed_42_full_samples

# Dataset arguments
dataset_samples: 50000
write_samples_probability: 1  # chance (0-1) to log each completion to completion_samples/*.txt; 0 to disable
min_nodes: 30
max_nodes: 30
min_chain_length: 15
max_chain_length: 15
sampling_strategy: uniform_size
max_label_value: 30
fixed_label_set: false
min_distance: 1
max_distance: 14  # L-Uniform: steps from 1 to L-1 (L=15)
min_start_value: 1
max_start_value: 10

# Training arguments (as per paper appendix)
num_train_epochs: 1
max_steps: 600
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.03

# GRPO specific parameters
beta: 0.0001
max_prompt_length: 512
max_completion_length: 1024
num_generations: 8
use_vllm: true
vllm_gpu_memory_utilization: 0.5

# Logging arguments
logging_strategy: steps
logging_steps: 1000
report_to:
- tensorboard
save_strategy: "steps"
save_steps: 500
seed: 42

# Hugging Face Hub 
push_to_hub: false
hub_strategy: every_save
