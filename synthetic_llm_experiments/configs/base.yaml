defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files: []
  val_files:
    - new_version/data/composition/val/op10-200.jsonl
    - new_version/data/composition/val/op11-200.jsonl
    - new_version/data/composition/val/op12-200.jsonl
    - new_version/data/composition/val/op13-200.jsonl
    - new_version/data/composition/val/op14-200.jsonl
    - new_version/data/composition/val/op15-200.jsonl
    - new_version/data/composition/val/op16-200.jsonl
    - new_version/data/composition/val/op17-200.jsonl
    - new_version/data/composition/val/op18-200.jsonl
    - new_version/data/composition/val/op19-200.jsonl
    - new_version/data/composition/val/op20-200.jsonl
  tokenizer:
  train_batch_size: 1024
  max_prompt_length: 1024
  max_response_length: 1024
  id_max_op: 10
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 36
  truncation: error
  custom_cls:
    path: verl/dataset.py
    name: CustomRLHFDataset

custom_reward_function:
  path: verl/dataset.py
  name: compute_score

actor_rollout_ref:
  model:
    path: new_version/models/extrapolation_rl/id2-10_0.2easy_0.3medium_0.5hard/base
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 16
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 6
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 16
    val_kwargs:
      n: 128
      temperature: 1.0
      do_sample: true
  ref:
    log_prob_micro_batch_size_per_gpu: 16
    fsdp_config:
      param_offload: true

trainer:
  critic_warmup: 0
  logger:
    - console
    - wandb
  project_name: composition-10B-op-RL
  experiment_name: unset
  default_local_dir: new_version/checkpoints/${trainer.experiment_name}
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 40
  test_freq: 10
  log_val_generations: 20
  total_epochs: 1
  total_training_steps: 200
